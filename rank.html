<html>
    <head>
        <meta name="viewport" charset="UTF-8"
        content="width=device-width, initial-scale=1">
        <title>RankMe</title>
        <link rel="icon" type="image/png" href="icon.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
        <link rel="stylesheet" href="rank.css"/>
        <link rel="stylesheet" href="main.css"/>
    </head>
    <body>
        <header>
            <div class="header-container">
                <menu>
                    <li class="name"><a href="index.html">RankMe<sup>&reg;</sup></a></li>
                    <li class="nav-item"><a href="index.html">Home</a></li>
                    <li class="nav-item"><a href="about.html">About</a></li>
                    <li class="nav-item"><a class = "active" href="rank.html">Start Ranking</a></li>
                    <li class="nav-item"><a href="saved.html">View Saved Rankings</a></li>
                    <li class="nav-item"><a href="share.html">Messages</a></li>
                </menu>
            </div>
        </header>
        <main>
            <div class="rank-info">
                <div class="user-info">User: Unkown User</div>
                <div> <label class="title-label">Title:</label><input class="title" placeholder="title" size="30"/> </div>
                <div class="save-share-container">
                    <a class="save-share" href="saved.html">Save</a> 
                    <a class="save-share" href="share.html">Share</a>
                </div>
            </div>
            <br />
            <div class="container">
                <div class="column">
                    <div class="list-container">
                        <ol class="ranked_list">
                            <li class="ranked-item"><input type="text" value="item" readonly></li>
                            <li class="ranked-item"><input type="text" value="item" readonly></li>
                            <li class="ranked-item"><input type="text" value="item" readonly></li>
                            <li class="ranked-item"><input type="text" value="item" readonly></li>
                            <li class="ranked-item"><input type="text" value="item" readonly></li>
                        </ol>
                    </div>
                    <button class="item-btn">+ Add Item</button>
                    <div class="drop-down">
                        <h3>Use Provided Rankings</h3>
                        <select class="drop-down-box">
                            <option value="option1" selected>Superheroes</option>
                            <option value="option2" selected>Fast Food Restaurants</option>
                            <option value="option3" selected>Types of Chairs</option>
                            <option value="option4" selected>Dinosaurs</option>
                            <option value="option5" selected>Star Wars Characters</option>
                        </select>
                    </div>
                </div>
                <div class="column">
                    <br />
                    <div class="table-container">
                        <table border="1" class="tier-list" cellpadding="40">
                            <tr>
                                <td class="s-tier">S</td>
                                <td class="row"></td>
                            </tr>
                            <tr>
                                <td class="a-tier">A</td>
                                <td class="row"></td>
                            </tr>
                            <tr>
                                <td class="b-tier">B</td>
                                <td class="row"></td>
                            </tr>
                            <tr>
                                <td class="c-tier">C</td>
                                <td class="row"></td>
                            </tr>
                            <tr>
                                <td class="d-tier">D</td>
                                <td class="row"></td>
                            </tr>
                        </table>
                    </div>
                    <br />
                    <fieldset class="item-bank">
                        <ul class="bank-list">
                            <li><input class="list-item" type="text" value="item" readonly></li>
                            <li><input class="list-item" type="text" value="item" readonly></li>
                            <li><input class="list-item" type="text" value="item" readonly></li>
                            <li><input class="list-item" type="text" value="item" readonly></li>
                            <li><input class="list-item" type="text" value="item" readonly></li>
                        </ul>
                    </fieldset>
                </div>
            </div>
        </main>
    </body>
    <footer>
        <div class="link-container">
            <span class="author">Jacob Morrill</span>
            <span class="github">Source:</span>
            <a class="github" href="https://github.com/JacobMorrill567/startup-project">GitHub</a>
        </div>
    </footer>
</html>
